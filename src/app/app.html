<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGOM-MX Sidebar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --bg-sidebar: #0f172a;
      --bg-sidebar-hover: #1e293b;
      --bg-sidebar-active: #1d4ed8; /* Azul destacado no item ativo */
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --text-nav: #94a3b8;
      --accent-blue: #3b82f6;
      --badge-red: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f1f5f9; /* Resto da tela em branco/claro */
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Container Principal da Sidebar */
    .sidebar {
      width: 280px;
      background-color: var(--bg-sidebar);
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid #1e293b;
    }

    /* Topo: Logo e Título */
    .sidebar-header {
      padding: 24px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
    }

    .brand-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon i {
      width: 24px;
      height: 24px;
    }

    .brand-text h1 {
      color: var(--text-main);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand-text p {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      margin-top: 2px;
    }

    .menu-toggle-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* Menu de Navegação Intermediário */
    .sidebar-menu-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
    }

    /* Customização da Scrollbar da Sidebar */
    .sidebar-menu-container::-webkit-scrollbar {
      width: 4px;
    }
    .sidebar-menu-container::-webkit-scrollbar-thumb {
      background: var(--bg-sidebar-hover);
      border-radius: 4px;
    }

    .menu-category {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 15px 24px 8px 24px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      color: var(--text-nav);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
      border-left: 4px solid transparent;
    }

    .menu-item:hover {
      background-color: var(--bg-sidebar-hover);
      color: var(--text-main);
    }

    .menu-item.active {
      background: linear-gradient(90deg, rgba(29, 78, 216, 0.2) 0%, rgba(15, 23, 42, 0) 100%);
      color: var(--text-main);
      font-weight: 600;
      border-left-color: var(--accent-blue);
    }

    .menu-item-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu-item i {
      width: 18px;
      height: 18px;
    }

    /* Badges de Notificação */
    .badge {
      background-color: var(--badge-red);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      min-width: 18px;
      text-align: center;
    }

    /* Rodapé: Perfil do Usuário */
    .sidebar-footer {
      background-color: #0b111e;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #1e293b;
    }

    .avatar {
      width: 40px;
      height: 40px;
      background-color: var(--accent-blue);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
    }

    .user-role {
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 2px;
    }

    /* Área de Conteúdo Vazia */
    .main-content {
      flex: 1;
      background-color: #0b0f19; /* Mantendo o fundo escuro integrado caso queira */
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    
    <div class="sidebar-header">
      <div class="brand-wrapper">
        <div class="brand-icon">
          <i data-lucide="stethoscopes"></i>
        </div>
        <div class="brand-text">
          <h1>SIGOM-MX</h1>
          <p>Ordem dos Médicos</p>
        </div>
      </div>
      <button class="menu-toggle-btn">
        <i data-lucide="menu"></i>
      </button>
    </div>

    <div class="sidebar-menu-container">
      
      <div class="menu-category">Principal</div>
      
      <a href="dashboard.html" class="menu-item active">
        <div class="menu-item-content">
          <i data-lucide="layout-dashboard"></i>
          <span>Dashboard</span>
        </div>
      </a>
      
      <a href="#" class="menu-item">
        <div class="menu-item-content">
          <i data-lucide="user-round"></i>
          <span>Médicos</span>
        </div>
      </a>
      
      <a href="pagamentos/pagamentos.html" class="menu-item">
        <div class="menu-item-content">
          <i data-lucide="credit-card"></i>
          <span>Pagamentos</span>
        </div>
        <span class="badge">3</span>
      </a>
      
      <a href="#" class="menu-item">
        <div class="menu-item-content">
          <i data-lucide="file-text"></i>
          <span>Recibos</span>
        </div>
      </a>

      <div class="menu-category">Gestão</div>
      
      <a href="medicos/medicos.html" class="menu-item">
        <div class="menu-item-content">
          <i data-lucide="building-2"></i>
          <span>Hospitais</span>
        </div>
      </a>
      
      <a href="#" class="menu-item">
        <div class="menu-item-content">
          <i data-lucide="calendar"></i>
          <span>Eventos</span>
        </div>
      </a>
      
      <a href="#" class="menu-item">
        <div class="menu-item-content">
          <i data-lucide="bar-chart-3"></i>
          <span>Relatórios</span>
        </div>
      </a>

      <div class="menu-category">Sistema</div>
      
      <a href="#" class="menu-item">
        <div class="menu-item-content">
          <i data-lucide="bell"></i>
          <span>Notificações</span>
        </div>
        <span class="badge">5</span>
      </a>
      
      <a href="#" class="menu-item">
        <div class="menu-item-content">
          <i data-lucide="settings"></i>
          <span>Configurações</span>
        </div>
      </a>

    </div>

    <div class="sidebar-footer">
      <div class="avatar">AD</div>
      <div class="user-info">
        <span class="user-name">Administrador</span>
        <span class="user-role">Superadmin</span>
      </div>
    </div>

  </aside>

  <main class="main-content"></main>

  <script>
    // Inicializa os ícones do Lucide
    lucide.createIcons();

    // Lógica em JS simples para alternar o estado ativo de clique
    const menuItems = document.querySelectorAll('.menu-item');
    
    menuItems.forEach(item => {
      item.addEventListener('click', function(e) {
        // Remove a classe ativa de todos
        menuItems.forEach(i => i.classList.remove('active'));
        // Adiciona ao item clicado
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
